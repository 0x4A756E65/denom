name: Release Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver tag to create (e.g. v0.1.0)"
        required: true
        type: string

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Create and push tag
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ ! $VERSION =~ ^v[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "Version must look like v1.2.3 (got '$VERSION')"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION"; then
            echo "Tag $VERSION already exists"
            exit 1
          fi
          git tag "$VERSION"
          git push origin "$VERSION"
